
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Menu</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  background-color: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.menu-card {
  background: #fff;
  width: 350px;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

.menu-card h1 {
  text-align: center;
  margin-bottom: 20px;
  color: #333;
}

.menu-section h2 {
  color: #e67e22;
  margin-bottom: 10px;
  border-bottom: 2px solid #e67e22;
  padding-bottom: 5px;
}

.menu-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px dashed #ccc;
  font-size: 16px;
}

.menu-item span:last-child {
  font-weight: bold;
}

  </style>
</head>
<body>

  <div class="menu-card">
    <h1>🍴 Food Menu</h1>

    <div class="menu-section">
      <h2>Starters</h2>
      <div class="menu-item">
        <span>Spring Rolls</span>
        <span>$5</span>
      </div>
      <div class="menu-item">
        <span>Garlic Bread</span>
        <span>$4</span>
      </div>
    </div>

    <div class="menu-section">
      <h2>Main Course</h2>
      <div class="menu-item">
        <span>Grilled Chicken</span>
        <span>$12</span>
      </div>
      <div class="menu-item">
        <span>Veg Pasta</span>
        <span>$10</span>
      </div>
    </div>

    <div class="menu-section">
      <h2>Desserts</h2>
      <div class="menu-item">
        <span>Chocolate Cake</span>
        <span>$6</span>
      </div>
      <div class="menu-item">
        <span>Ice Cream</span>
        <span>$5</span>
      </div>
    </div>

  </div>

</body>
</html>

</body>
</html>
