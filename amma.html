<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
   <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #4CAF50, #2E8B57);
}

.login-box {
    background: #fff;
    padding: 40px;
    width: 350px;
    border-radius: 10px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.2);
}

.login-box h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
}

.input-box {
    position: relative;
    margin-bottom: 25px;
}

.input-box input {
    width: 100%;
    padding: 10px;
    border: none;
    border-bottom: 2px solid #777;
    outline: none;
    font-size: 16px;
    background: transparent;
    transition: 0.3s;
}

.input-box label {
    position: absolute;
    top: 50%;
    left: 5px;
    transform: translateY(-50%);
    color: #777;
    pointer-events: none;
    transition: 0.3s;
}

.input-box input:focus,
.input-box input:valid {
    border-bottom-color: #4CAF50;
}

.input-box input:focus + label,
.input-box input:valid + label {
    top: -10px;
    font-size: 13px;
    color: #4CAF50;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    background: #4CAF50;
    color: #fff;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: #45a049;
}

.signup {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
}

.signup a {
    color: #4CAF50;
    text-decoration: none;
}

   </style>
</head>
<body>

    <div class="login-box">
        <h2>Login</h2>

        <form>
            <div class="input-box">
                <input type="text" required>
                <label>Username</label>
            </div>

            <div class="input-box">
                <input type="password" required>
                <label>Password</label>
            </div>

            <button type="submit" class="btn">
                 Login</button>

            <p class="signup">
                Don’t have an account? <a href="#">Sign Up</a>
            </p>
        </form>
    </div>

</body>
</html>
